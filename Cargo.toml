[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
repository = "https://github.com/jash90/geokernel"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Test builds of egui without its debug assertions. With them every new
# widget id is formatted into a table shared by the whole process, so the
# frame counters of `geo-app` (allocations and bytes of one thread) depended
# on which test thread created an id first or made that table grow. Release
# builds have no such table, which the counters now match.
[profile.test.package.egui]
debug-assertions = false
