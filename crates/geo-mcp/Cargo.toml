[package]
name = "geo-mcp"
description = "MCP server that drives the geokernel window headlessly: pointer, touch, keyboard and tools in, exact state out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geo_mcp"
path = "src/lib.rs"

[[bin]]
name = "geokernel-mcp"
path = "src/main.rs"

[dependencies]
geo-kernel = { path = "../geo-kernel" }
geo-app-core = { path = "../geo-app-core" }
# The window's own frame loop without a window.
geo-app = { path = "../geo-app", features = ["headless"] }
# The protocol is a small hand-written JSON-RPC server over stdio.
serde_json = "1"
# Screenshots: egui's off-screen wgpu renderer (the one the window's render
# tests use), created fallibly, and PNG output.
egui_kittest = { version = "0.37", features = ["wgpu"] }
egui-wgpu = "0.37"
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
