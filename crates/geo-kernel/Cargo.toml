[package]
name = "geo-kernel"
description = "Dynamic-geometry construction kernel: a dependency graph with incremental updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Evaluates the CAS commands that have a Giac translation with the Giac
# library loaded at run time (GPL; see docs/cas-giac.md). Off by default.
giac = ["dep:geo-giac", "geo-giac/giac"]

[dependencies]
geo-giac = { path = "../geo-giac", optional = true }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Use the same trigonometric rounding on each target. Seeded root finding
# can amplify a one-bit difference enough to select a different intersection.
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
geo-latex = { path = "../geo-latex" }
