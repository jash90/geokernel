[package]
name = "geo-import"
description = "Reads and writes .ggb construction files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
geo-kernel = { path = "../geo-kernel" }
# Pull parser; the optional encoding and serde features are not needed.
quick-xml = "0.42"
# Inflate with an output limit; the zip directory is read by `archive.rs`.
miniz_oxide = "0.9"
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
png = "0.18"
geo-golden = { path = "../geo-golden" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
