# Objects of the stored files whose imported value differs from the golden
# snapshot and from the value saved in the file, for a reason that lies in what
# GeoGebra writes, not in the kernel or the importer. Each entry pins the exact
# values on both sides, so nothing else can hide behind it: the test fails
# when the golden value, the imported value or the reason for the disagreement
# change, or when the object stops disagreeing.
#
# All five are `Distance(line, line)` of two lines whose raw coefficients are
# about 1e-6 (a line through points 1e-6 apart). `GeoLine.distance(GeoLine)`
# returns 0 for lines that are not parallel, and tests "parallel" with
# `isZero(g.x * y - g.y * x)` on the raw coefficients, where products of two
# 1e-6 numbers are below the zero threshold: such lines count as parallel,
# a point of `g` is chosen and the distance is measured with the
# normalisation of `this`, so the order of the two lines matters. For
# ordinary lines it does not (a single zero either way).
#
# `AlgoDistanceLineLine.setInputOutput` writes `input[0] = h; input[1] = g`,
# the reverse of the order the algorithm computes in, so the saved command
# lists the lines in the opposite order. GeoGebra's reader evaluates the saved
# command in the saved order, and the importer does the same (loading the four
# files into a fresh GeoGebra gives the imported values, see
# `tools/ggb-harness/harness.sh reload`). The value saved in the file is the
# golden one, so the cross-check reports these objects in `mismatched`.

