[package]
name = "geo-app"
description = "Desktop window for geo-kernel: draw a construction and drag its free points"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The window as a library (an rlib), so that the desktop binary and a later
# Android shell crate share it; `main.rs` is only the desktop glue.
[lib]
name = "geo_app"
path = "src/lib.rs"

[[bin]]
name = "geokernel-app"
path = "src/main.rs"

[features]
# The window driven without a window (`geo_app::headless`), for the
# `geokernel-mcp` server. Off by default: the desktop app does not compile it.
headless = []

[dependencies]
geo-kernel = { path = "../geo-kernel" }
geo-app-core = { path = "../geo-app-core" }
# Default features are off to avoid pulling in glow, accesskit and the web
# helpers. We want the wgpu renderer and the bundled fonts everywhere.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }

# Both Linux window systems, on Linux only: Cargo merges these features with
# the ones above, and other targets (macOS, Windows, later Android) build
# without them.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

# The Android build will be a separate shell crate (a `cdylib` with
# `android_main` and eframe's `android-game-activity` feature for that
# target) that depends on this library. None of it is added yet.

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
