# Controller-test scenarios the window cannot pass yet.
#
# [[gap]] entries name a ported scenario of upstream_tools.rs and must keep
# disagreeing with it: when the scenario starts passing, the entry is stale
# and the test fails. The [[missing]] entries are the upstream test methods
# whose tool the window does not have at all (pen, shapes, masks, inline
# texts); they are an audit list: when one of those tools lands, port its
# scenario and drop the entry.

[[gap]]
id = "mirrorAtPointTool"
category = "behaviour"
reason = "upstream clicks empty space twice and the reflection tool makes a new point each time, then types a circle and mirrors it at the same point; the window's reflect-at-point tool picks existing objects only and ignores clicks on empty space, so of the ported scenario only the typed circle appears (the input row reads the equation; nothing reflects)"

[[gap]]
id = "mirrorAtLineTool"
category = "behaviour"
reason = "upstream clicks empty space to make the point to reflect and again on the line; the window's reflect-at-line tool ignores a click on empty space"

[[gap]]
id = "deleteTool"
category = "app-bug"
reason = "upstream builds the lines a: x = 1 and b: y = -1, clicks their intersection twice and checks a: x = 1 after the first click and an empty construction after the second; the window's delete tool removes the first line but its paint then panics on the pointer's stale hovered id (draw.rs builds the curve layer for hovered and selected ids without checking the id still exists; being fixed in draw.rs/canvas.rs), so neither checkpoint is reached"

[[gap]]
id = "rotateByAngleToolMultiplePointsToExistingPoint"
category = "selection"
reason = "upstream drag-selects two points in a box, then rotates both by 180deg around an existing point; the window has no box selection, so only one point rotates"

[[gap]]
id = "rotateByAngleToolMultiplePointsToNewPoint"
category = "selection"
reason = "upstream drag-selects two points and rotates them by 270deg around a new point; no box selection in the window"

[[gap]]
id = "rotateByAngleToolObjectToExistingPoint"
category = "unsupported-kind"
reason = "upstream clicks a polygon and rotates it by 270deg; the rotate tool accepts points, lines, segments and circles only"

[[gap]]
id = "rotateByAngleToolMultipleObjectsToNewPoint"
category = "selection"
reason = "upstream drag-selects two circles and rotates them by 180deg around a new point; no box selection in the window"

