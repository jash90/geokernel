[package]
name = "geo-golden"
description = "Golden-data tests: compares geo-kernel against values recorded from GeoGebra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Runs the golden data with the kernel's Giac backend (docs/cas-giac.md).
giac = ["geo-kernel/giac"]

[dependencies]
geo-app-core = { path = "../geo-app-core" }
geo-import = { path = "../geo-import" }
geo-kernel = { path = "../geo-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

[dev-dependencies]
geo-latex = { path = "../geo-latex" }
zip = { version = "9.6", default-features = false }
