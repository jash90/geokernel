# Cases that still differ with Giac, with the reason that remains.

[[gap]]
id = "cas-conic-060"
reason = "With Giac the kernel sends the reference's exact input and gets the same output {y=x^2+x}. The reference reads the quadratic equation y = x^2 + x as a conic (a parabola); the kernel's reader of Giac output builds lines and functions but no conics, so it gives the function x^2 + x."
mismatches = ["0:result"]

[[gap]]
id = "cas-freevariable-008"
reason = "With Giac the system {x + y = 1, z = 0} in {x, y, z} still differs: the reference's two-dimensional parser reads the equation z = 0 as the number 0 and sends solve({(x)+(y)=1, 0},{x, y, z}), while the kernel sends z=0. Giac then answers {{-y+1,y,z}} for the reference; the elements in the free variables y and z are functions of z, and x = -y + 1 is an implicit curve in the reference's reading, which the kernel's reader of Giac output does not build."
mismatches = ["0:r1", "0:r2"]

[[gap]]
id = "cas-freevariable-009"
reason = "With Giac the kernel sends the reference's exact input and gets the same output ({{-1/2*z+1/2,-1/2*z+1/2,z}} and {{x=(-1/2*z+1/2),y=(-1/2*z+1/2),z=z}}), but the solutions depend on the free variable z: the reference reads -1/2 z + 1/2 as a function of z and x = -1/2 z + 1/2 as an implicit curve; the kernel's reader of Giac output builds functions of x or y only and no implicit curves, so the lists are undefined."
mismatches = ["0:r1", "0:r2"]

[[gap]]
id = "cas-freevariable-010"
reason = "With Giac the kernel sends the reference's exact input and gets the same output, but the solutions depend on the free variable z: the reference reads them as functions of z and the assignments as implicit curves; the kernel's reader of Giac output builds functions of x or y only and no implicit curves, so the lists are undefined."
mismatches = ["0:r1", "0:r2"]

[[gap]]
id = "cas-freevariable-011"
reason = "With Giac the kernel sends the reference's exact input and gets the same output, but the solutions depend on the free variable z: the reference reads them as functions of z and the assignments as implicit curves; the kernel's reader of Giac output builds functions of x or y only and no implicit curves, so the lists are undefined."
mismatches = ["0:r1", "0:r2"]

[[gap]]
id = "cas-name-012"
reason = "With Giac every result but r7 agrees. For Solve(f, z = 1) the reference's two-dimensional parser reads the second argument z = 1 as the number 1 and sends assume(1); the kernel sends the equation z=1, for which Giac answers {x=-3,x=3} instead of {}."
mismatches = ["0:r7"]
