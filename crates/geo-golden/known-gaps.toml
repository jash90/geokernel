reason = "GeoGebra fixes the order of the two points on the first move after they first become distinct, by nearness to the previous points (AlgoIntersectLineConic.permutation, firstIntersection, isPermutationNeeded); here that move reverses the line, so GeoGebra keeps the reversed order while the stateless kernel keeps the order of the computation"
