# Matrix and dilation forms that need new object representations.
# ApplyMatrix(list,curve) and ApplyMatrix(list,function) produce a parametric
# curve. For a function, GeoGebra first builds the curve (t, f(t)) over the
# view-dependent parameter interval. The matrix then transforms coordinate
# functions, including homogeneous division for 3 x 3 matrices. The kernel
# does not yet transform parametric curves with matrices.
# Dilate(curve,number) and Dilate(curve,number,point) transform both coordinate
# functions about the origin or the center and retain the parameter interval.
# Zero factor can leave a constant parametric curve. Dilation of parametric
# curves is also unsupported.
# ApplyMatrix(list,image), Dilate(image,number) and Dilate(image,number,point)
# transform the image's placement corners (GeoImage.initTransformPoints);
# matrix images also support projective division. The kernel has no image
# object with placement corners.
# Invert(function) handles the symbolic inversion rules. The fallback through
# AlgoFunctionInvert.computeOutputUsingCAS requires a CAS.
# List transforms handle points, vectors, and the scalar entries interleaved
# with them. Lists of other geometry need corresponding element
# representations, including curve and conic records.

