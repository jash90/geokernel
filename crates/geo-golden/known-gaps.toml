# lines

[[gap]]
id = "lines-oncircle-005"
reason = "the point starts on the circle, so GeoGebra labels one tangent. With continuity off the tangent order is the fixed AlgoIntersectLineConic.permutation of the helper intersection (AlgoTangentPointND.algoIntersect). AlgoIntersectLineConic.firstIntersection stays true while both tangent points coincide, which keeps isPermutationNeeded true, and permutation is then set by a near-to match against the previous points D on the update after the one that clears firstIntersection. Which tangent t follows depends on the path; the kernel always follows the first (left) tangent"
