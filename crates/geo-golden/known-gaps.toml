# Long, nearly parallel lines: the raw cross product is above 1e-8 and the
# unit-normal one below it, so GeoGebra intersects them far away and defines
# both bisectors through that point, while the kernel treats them as
# parallel (its b_{1} is the middle line, slightly off GeoGebra's, and its
# b_{2} is undefined).
[[gap]]
id = "lines-anglelines-012"
reason = "GeoGebra applies its zero test to raw line coefficients; the kernel stores lines normalised"
mismatches = ["2:b_{1}", "2:b_{2}", "3:b_{1}", "3:b_{2}", "4:b_{1}", "4:b_{2}", "6:b_{1}", "6:b_{2}"]

# vector

[[gap]]
id = "vector-ray-008"
reason = "GeoGebra keeps the intersection of two parallel lines as a point at infinity and makes Ray(C, S) the ray from C in its direction; the kernel has no points at infinity, so S and the ray are undefined"
mismatches = ["1:h"]

[[gap]]
id = "vector-rawscale-001"
reason = "GeoGebra applies Direction to the raw coefficients of the line bisector; the kernel stores lines normalised and does not rebuild the raw scale of lines from other groups, so the direction has the right sense but length 1"
mismatches = ["0:d", "1:d", "2:d"]

[[gap]]
id = "vector-rawscale-002"
