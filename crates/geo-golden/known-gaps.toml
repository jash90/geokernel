# intersect

[[gap]]
id = "intersect-history-003"
reason = "GeoGebra fixes the order of the two points on the first move after they first become distinct, by nearness to the previous points (AlgoIntersectLineConic.permutation, firstIntersection, isPermutationNeeded); here that move reverses the line, so GeoGebra keeps the reversed order while the stateless kernel keeps the order of the computation"
mismatches = ["2:P", "4:P", "5:P"]

[[gap]]
id = "intersect-itself-004"
reason = "Intersect(k, k, 1) is the earlier intersection point X of k (AlgoIntersectConics.getPointFrom1on2), but X is not an input of the algorithm, so GeoGebra does not recompute P when only X moves (here the line f moves and k stays) and keeps the old position until k changes; the kernel reads X as a hidden parent and always shows the current X"
mismatches = ["1:P", "3:P"]

[[gap]]
id = "intersect-itself-005"
reason = "as intersect-itself-004: P = Intersect(k, k, 1) and R = Intersect(c, c, 1) are the earlier point X = Intersect(c, k, 2); GeoGebra keeps P at its old position while only c changes and R while only k changes, the kernel always shows the current X"
mismatches = ["1:P", "2:P", "3:P", "4:P", "5:R"]

# vector

[[gap]]
id = "vector-ray-008"
reason = "GeoGebra keeps the intersection of two parallel lines as a point at infinity and makes Ray(C, S) the ray from C in its direction; the kernel has no points at infinity, so S and the ray are undefined"
mismatches = ["1:h"]

# A parallel and a perpendicular through S = Intersect(l, m): GeoGebra keeps
# S in homogeneous coordinates with z the raw cross product of l and m
# (AlgoIntersectLines, GeoVec3D.cross), and AlgoLinePointLine and
# AlgoOrthoLinePointLine multiply by it, so Direction and OrthogonalVector
# show that factor. The lines, Slope and Distance(line, line) agree.
[[gap]]
id = "vector-rawscale-008"
reason = "points carry no homogeneous weight"
mismatches = ["0:d", "0:e", "1:d", "1:e", "2:d", "2:e", "3:d", "3:e", "4:d", "4:e"]

[[gap]]
id = "vector-rawscale-009"
reason = "points carry no homogeneous weight"
mismatches = ["0:o", "1:o", "2:o", "3:o", "4:o"]

# predicates

# An undefined circle (radius below 0) keeps the conic matrix it had while it
# was last defined in GeoGebra, so a predicate on it still answers from that
# stale matrix. The kernel has no value for an undefined circle.
[[gap]]
id = "predicates-equal-017"
reason = "GeoGebra compares the stale conic matrix an undefined circle keeps from its last defined state; the kernel has no value for the circle"
mismatches = ["4:t"]

[[gap]]
id = "predicates-tangent-013"
reason = "GeoGebra tests tangency against the stale conic matrix an undefined circle keeps from its last defined state; the kernel has no value for the circle"
mismatches = ["5:t"]

[[gap]]
id = "predicates-infinity-001"
reason = "GeoGebra keeps the intersection of parallel lines as a point at infinity, equal to itself; the kernel has no points at infinity, so S is undefined and AreEqual(S, S) is false"
mismatches = ["0:o", "2:o", "3:o"]

[[gap]]
id = "predicates-homogeneous-001"
reason = "AreConcyclic reads the homogeneous coordinates of intersection points, whose weight is the raw cross product of the lines; the kernel assumes weight 1, and Ptolemy's test on the scaled coordinates gives another answer"
mismatches = ["0:t"]

