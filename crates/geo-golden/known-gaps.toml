# Golden cases that geo-kernel cannot reproduce yet.
#
# Every entry needs the case id, a non-empty reason and the exact list of
# disagreeing objects as "step:label":
#
# [[gap]]
# id = "geometry-0001"
# reason = "why the kernel differs from GeoGebra"
# mismatches = ["0:Q", "2:Q"]
#
# The test fails when a listed case disagrees anywhere else, or agrees where
# the list says it does not, so an entry can neither hide a new difference
# nor go stale.

