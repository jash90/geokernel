# predicates

# An undefined circle (radius below 0) keeps the conic matrix it had while it
# was last defined in GeoGebra, so a predicate on it still answers from that
# stale matrix. The kernel has no value for an undefined circle.
[[gap]]
id = "predicates-equal-017"
reason = "GeoGebra compares the stale conic matrix an undefined circle keeps from its last defined state; the kernel has no value for the circle"
mismatches = ["4:t"]

[[gap]]
id = "predicates-tangent-013"
reason = "GeoGebra tests tangency against the stale conic matrix an undefined circle keeps from its last defined state; the kernel has no value for the circle"
mismatches = ["5:t"]

[[gap]]
id = "predicates-infinity-001"
reason = "GeoGebra keeps the intersection of parallel lines as a point at infinity, equal to itself; the kernel has no points at infinity, so S is undefined and AreEqual(S, S) is false"
