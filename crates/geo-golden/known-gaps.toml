# intersect

[[gap]]
id = "intersect-history-003"
reason = "GeoGebra fixes the order of the two points on the first move after they first become distinct, by nearness to the previous points (AlgoIntersectLineConic.permutation, firstIntersection, isPermutationNeeded); here that move reverses the line, so GeoGebra keeps the reversed order while the stateless kernel keeps the order of the computation"
mismatches = ["2:P", "4:P", "5:P"]

[[gap]]
id = "intersect-itself-004"
reason = "Intersect(k, k, 1) is the earlier intersection point X of k (AlgoIntersectConics.getPointFrom1on2), but X is not an input of the algorithm, so GeoGebra does not recompute P when only X moves (here the line f moves and k stays) and keeps the old position until k changes; the kernel reads X as a hidden parent and always shows the current X"
mismatches = ["1:P", "3:P"]

[[gap]]
id = "intersect-itself-005"
reason = "as intersect-itself-004: P = Intersect(k, k, 1) and R = Intersect(c, c, 1) are the earlier point X = Intersect(c, k, 2); GeoGebra keeps P at its old position while only c changes and R while only k changes, the kernel always shows the current X"
mismatches = ["1:P", "2:P", "3:P", "4:P", "5:R"]

