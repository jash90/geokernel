# The 2D forms of commands that are done, and the evidence for each.
#
# One row per form of tools/command-matrix/forms.csv:
#
# [[form]]
# command = "Midpoint"          # the command as named in docs/command-matrix.csv
# form = "point,point"          # one form of forms.csv, exactly as written there
# cases = ["conic-midseg-001"]  # golden cases that call it in this form
#
# A row can also use `difference = "section-slug: Area text"`: a row of
# DIFFERENCES.md (the slug of the heading it is under and its first cell)
# whose first cell names the form, such as `Mod(function, function)` in
# backticks, and whose reason is a disposition, not "Not implemented".
#
# crates/geo-golden/tests/command_forms.rs checks every row: each case exists,
# is not a known gap, and calls the command with arguments matching the
# form. For a transformation's `any` source argument, the cited
# cases together cover all supported core geometry kinds for that signature.
# Other wildcard forms require a difference row and can cite cases that
# demonstrate the supported arguments.
# `forms_done` in docs/command-matrix.csv counts these rows; regenerate the
# matrix after editing (README.md in this directory).

