name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, the full test suite and the Android check run on the
  # project's own macOS runner for pushes and for pull requests from this
  # repository. Pull requests from forks never reach that machine: they run
  # the same job on a GitHub-hosted Linux runner instead.
  check:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "geokernel"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The self-hosted runner keeps its target directory between runs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # System packages needed to build the application crate on Linux.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The upstream t-pairs report (pass/gap per command) is the entry
      # point of the GeoGebra-test-driven workflow; print it so a red
      # command can be seen in the log without a local run.
      - name: Upstream t-pairs report
        run: cargo test -p geo-golden --test tpairs -- --nocapture
      # Timings are only meaningful on a fixed, quiet machine, so CI only
      # makes sure the benchmark still builds.
      - name: Build benchmark
        run: cargo build --release -p geo-cli
      # The kernel, the importer and the window's logic must keep building for
      # Android; the window itself is not built for it yet.
      - name: Check Android target
        run: |
          rustup target add aarch64-linux-android
          cargo check --target aarch64-linux-android -p geo-kernel -p geo-import -p geo-app-core

  # The desktop release targets macOS, Windows and Linux; the job above covers
  # macOS, this one builds and tests the workspace on the other two systems.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Test
        run: cargo test --workspace
      - name: Build application
        run: cargo build --release -p geo-app
