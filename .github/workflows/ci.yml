name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, the full test suite and the Android check run on the
  # project's own Linux runners for pushes and for pull requests from this
  # repository. Pull requests from forks never reach those machines: they run
  # the same job on a GitHub-hosted Linux runner instead.
  check:
    runs-on: >-
      ${{ (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      fromJSON('["self-hosted", "geokernel"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The self-hosted runner keeps its target directory between runs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # System packages needed to build the application crate on Linux.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Match the desktop matrix's test concurrency for the wall-clock budgets.
        run: cargo test --workspace -- --test-threads=2
      - name: Check reference corpus input layout
        run: python3 -I tools/ggb-harness/cases/test_corpus_layout.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the headless reference harness
        run: |
          export GEOGEBRA_REV=112919f2d450ec7430a5cd3b65dba226fdc43b74
          GEOGEBRA_SRC="$(mktemp -d "$RUNNER_TEMP/geogebra.XXXXXX")"
          export GEOGEBRA_SRC
          printf 'GEOGEBRA_SRC=%s\n' "$GEOGEBRA_SRC" >> "$GITHUB_ENV"
          git init "$GEOGEBRA_SRC"
          git -C "$GEOGEBRA_SRC" fetch --depth=1 \
            https://github.com/geogebra/geogebra.git "$GEOGEBRA_REV"
          git -C "$GEOGEBRA_SRC" checkout --detach FETCH_HEAD
          tools/ggb-harness/harness.sh build
      - name: Reload exported archives in the reference app
        run: cargo test -p geo-golden --test export -- --ignored --nocapture
      # The upstream t-pairs report (pass/gap per command) is the entry
      # point of the GeoGebra-test-driven workflow; print it so a red
      # command can be seen in the log without a local run.
      - name: Upstream t-pairs report
        run: cargo test -p geo-golden --test tpairs -- --nocapture
      # Timings are only meaningful on a fixed, quiet machine, so CI only
      # makes sure the benchmark still builds.
      - name: Build benchmark
        run: cargo build --release -p geo-cli
      # The kernel, the importer and the window's logic must keep building for
      # Android; the window itself is not built for it yet.
      - name: Check Android target
        run: |
          rustup target add aarch64-linux-android
          cargo check --target aarch64-linux-android \
            -p geo-kernel -p geo-import -p geo-app-core

  # The optional Giac backend (docs/cas-giac.md): the binding replays the
  # recorded Giac exchanges and the golden data runs with the feature on
  # against known-gaps-giac.toml. Giac 70507 comes from the reference's own
  # release repository; its SHA-256 is pinned in tools/giac/fetch.sh.
  giac-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Giac
        run: |
          path="$(tools/giac/fetch.sh)"
          echo "GEO_GIAC_LIBRARY=$path" >> "$GITHUB_ENV"
      - name: Clippy with the feature
        run: |
          cargo clippy -p geo-giac -p geo-kernel -p geo-golden --all-targets \
            --features geo-golden/giac -- -D warnings
      - name: Binding tests
        run: |
          cargo test -p geo-giac --features giac
          cargo test -p geo-giac --features giac --example replay
      - name: Replay the recorded Giac exchanges
        run: |
          cargo run -p geo-giac --features giac --example replay -- tools/giac/cas-exchanges.jsonl
      - name: Kernel tests with the feature
        run: |
          cargo test -p geo-kernel --features giac \
            -- --skip mutated_corpus_lines_never_panic
      # The mutation fuzz runs with the library absent: a mutated CAS input
      # can crash the native library (a segmentation fault ends the whole
      # test binary) or take the library's whole time limit per line, and the
      # test has a wall-clock budget. The recorded CAS inputs run with the
      # library in the golden step below.
      - name: Mutation fuzz with the feature and no library
        run: |
          env -u GEO_GIAC_LIBRARY cargo test -p geo-kernel --features giac \
            --test fuzz_script
      - name: Golden data with the feature
        run: |
          GEO_GOLDEN_REQUIRE_GIAC=1 cargo test -p geo-golden --features giac --test golden -- --nocapture
      - name: Command forms with the feature
        run: cargo test -p geo-golden --features giac --test command_forms
      # Without a library the feature must change nothing.
      - name: Golden data with the feature and no library
        run: |
          env -u GEO_GIAC_LIBRARY cargo test -p geo-golden --features giac \
            --test golden -- --nocapture

  giac-desktop:
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: giac-macos
            # Giac 70507 on Apple Silicon has the GMP fault in docs/cas-giac.md.
            os: macos-15-intel
          - job: giac-windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Giac
        id: fetch
        run: |
          path="$(tools/giac/fetch.sh)"
          echo "GEO_GIAC_LIBRARY=$path" >> "$GITHUB_ENV"
      - name: Clippy with the feature
        run: |
          cargo clippy -p geo-giac -p geo-kernel -p geo-golden --all-targets \
            --features geo-golden/giac -- -D warnings
      - name: Binding tests
        run: |
          cargo test -p geo-giac --features giac
          cargo test -p geo-giac --features giac --example replay
      - name: Kernel tests with the feature
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          cargo test -p geo-kernel --features giac \
            -- --skip mutated_corpus_lines_never_panic
      # The mutation fuzz runs with the library absent: a mutated CAS input
      # can crash the native library (a segmentation fault ends the whole
      # test binary) or take the library's whole time limit per line, and the
      # test has a wall-clock budget. The recorded CAS inputs run with the
      # library in the golden step below.
      - name: Mutation fuzz with the feature and no library
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          env -u GEO_GIAC_LIBRARY cargo test -p geo-kernel --features giac \
            --test fuzz_script
      # The golden test checks the recorded platform variants at the
      # affected snapshot positions and the shared corpus everywhere else.
      - name: Golden data with the feature
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          GEO_GOLDEN_REQUIRE_GIAC=1 cargo test -p geo-golden --features giac --test golden -- --nocapture
      - name: Command forms with the feature
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: cargo test -p geo-golden --features giac --test command_forms
      # Without a library the feature must change nothing.
      - name: Golden data with the feature and no library
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          env -u GEO_GIAC_LIBRARY cargo test -p geo-golden --features giac \
            --test golden -- --nocapture

      - name: Replay the recorded Giac exchanges
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          fixture=tools/giac/cas-exchanges-macos-intel.jsonl
          if [ "$RUNNER_OS" = Windows ]; then
            fixture=tools/giac/cas-exchanges-windows.jsonl
          fi
          cargo run -p geo-giac --features giac --example replay -- "$fixture"

  # The desktop release targets macOS, Windows and Linux; this job builds and
  # tests the workspace on all three systems. A break that only one target's
  # compiler or dependency graph shows (the macOS one adds `objc2`) fails here.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Test
        # Limit contention between the wall-clock tests on hosted runners.
        run: cargo test --workspace -- --test-threads=2
      - name: Build application
        run: cargo build --release -p geo-app
