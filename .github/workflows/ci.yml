name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # System packages needed to build the application crate on Linux.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Timings are only meaningful on a fixed, quiet machine, so CI only
      # makes sure the benchmark still builds.
      - name: Build benchmark
        run: cargo build --release -p geo-cli
      # The kernel, the importer and the window's logic must keep building for
      # Android; the window itself is not built for it yet.
      - name: Check Android target
        run: |
          rustup target add aarch64-linux-android
          cargo check --target aarch64-linux-android -p geo-kernel -p geo-import -p geo-app-core

  # The desktop release targets macOS, Windows and Linux; the job above covers
  # Linux, this one builds and tests the workspace on the other two systems.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build application
        run: cargo build --release -p geo-app
